name: Mi Primer Workflow

on:
  push:

jobs:
  python-demo:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar Python
        run: python --version

      - name: Ejecutar script
        run: python hola.py